<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .video-container {
            position: relative;
            display: inline-block;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .splash-logo {
            width: 100%;
            max-width: 320px; /* Allows the image to be reasonably sized */
            height: auto;
            object-fit: contain;
            display: block;
            border-radius: 8px; /* Slight rounding looks good for thumbnails */
        }
        .play-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 64px;
            height: 64px;
            background-color: rgba(0, 0, 0, 0.5);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s ease;
            backdrop-filter: blur(2px);
        }
        /* CSS triangle to create the play symbol */
        .play-icon::after {
            content: '';
            display: block;
            border-style: solid;
            border-width: 12px 0 12px 20px;
            border-color: transparent transparent transparent #ffffff;
            margin-left: 6px; /* Visually centers the triangle in the circle */
        }
        .video-container:hover .play-icon {
            background-color: rgba(0, 0, 0, 0.7);
            transform: translate(-50%, -50%) scale(1.05);
        }
        .video-container:active .play-icon {
            transform: translate(-50%, -50%) scale(0.95);
        }
    </style>
</head>
<body>
    <a href="login.html" class="video-container">
        <img src="1000024877.jpg" alt="Media" class="splash-logo">
        <div class="play-icon"></div>
    </a>
</body>
</html>
